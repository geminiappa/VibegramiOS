
name: Build Vibegram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Check Apple tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Find Vibegram Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type d \
            -name "Vibegram.xcodeproj" \
            -print -quit)"

          if [[ -z "$PROJECT_PATH" ]]; then
            echo "::error::Vibegram.xcodeproj was not found."
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -print
            exit 1
          fi

          SCHEME_FILE="$PROJECT_PATH/xcshareddata/xcschemes/Vibegram.xcscheme"

          if [[ ! -f "$SCHEME_FILE" ]]; then
            echo "::error::Shared Vibegram scheme was not found."
            xcodebuild -list -project "$PROJECT_PATH" || true
            exit 1
          fi

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_PATH"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme Vibegram

      - name: Build Vibegram for iPhone
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme Vibegram \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VibegramBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/VibegramBuild/Build/Products/Release-iphoneos"
          APP_PATH="$PRODUCTS/Vibegram.app"

          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH="$(find "$PRODUCTS" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print -quit || true)"
          fi

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Build succeeded but the .app bundle was not found."
            find "$RUNNER_TEMP/VibegramBuild/Build/Products" \
              -maxdepth 4 -print || true
            exit 1
          fi

          if [[ ! -f "$APP_PATH/Info.plist" ]]; then
            echo "::error::Info.plist is missing."
            exit 1
          fi

          plutil -lint "$APP_PATH/Info.plist"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Application validated: $APP_PATH"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_DIR="$RUNNER_TEMP/VibegramIPA"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$IPA_DIR/Payload/$APP_NAME"

          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/Vibegram-unsigned.ipa" \
              Payload
          )

          if [[ ! -s "$GITHUB_WORKSPACE/Vibegram-unsigned.ipa" ]]; then
            echo "::error::IPA file was not created."
            exit 1
          fi

          echo "IPA created successfully."
          ls -lh "$GITHUB_WORKSPACE/Vibegram-unsigned.ipa"
          /usr/bin/unzip -l \
            "$GITHUB_WORKSPACE/Vibegram-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Vibegram-unsigned-IPA
          path: Vibegram-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
